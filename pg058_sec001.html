      <div id="content" class="container content mx-auto max-w-6xl p-0 bg-white opacity-0"><section data-section-type="boxed_text" data-section-id="pg058_sec001" class="flex items-start justify-center py-6 max-sm:py-3"><div class="w-full max-w-4xl px-6 py-8 max-sm:px-4 max-sm:py-5"><div class="w-full rounded-lg border border-gray-300 bg-white px-8 py-8 text-left text-gray-900 shadow-sm max-sm:px-4 max-sm:py-5"><h1 class="font-bold text-[2rem] leading-none max-lg:text-[1.6rem] max-sm:text-[1.25rem]" data-id="pg058_n0002">Mfano wa pili</h1><p class="mt-8 text-[1.15rem] leading-[1.45] max-lg:mt-6 max-lg:text-[1rem] max-sm:mt-4 max-sm:text-[0.95rem] max-sm:leading-[1.4]" data-id="pg058_n0003">Badili m 4,500 kuwa kilometa na meta.</p><h2 class="mt-4 font-bold text-[1.2rem] leading-tight max-lg:text-[1.05rem] max-sm:mt-3 max-sm:text-[1rem]" data-id="pg058_n0004">Njia</h2><p class="mt-1 text-[1.1rem] leading-[1.42] max-lg:text-[0.98rem] max-sm:text-[0.95rem] max-sm:leading-[1.35]" data-id="pg058_n0005">Tumia uhusiano wa kilometa na meta</p><p class="text-[1.1rem] leading-[1.42] max-lg:text-[0.98rem] max-sm:text-[0.95rem] max-sm:leading-[1.35]" data-id="pg058_n0006">m 4500 = m 4000 + m 500</p><p class="text-[1.1rem] leading-[1.42] max-lg:text-[0.98rem] max-sm:text-[0.95rem] max-sm:leading-[1.35]" data-id="pg058_n0007">Badili m 4000 kuwa km:</p><p class="text-[1.1rem] leading-[1.42] max-lg:text-[0.98rem] max-sm:text-[0.95rem] max-sm:leading-[1.35]" data-id="pg058_n0008">km 1 = m 1000</p><p class="text-[1.02rem] leading-[1.34] max-lg:text-[0.9rem] max-sm:text-[0.9rem] max-sm:leading-[1.3]" data-id="pg058_n0009">m 4000 = (m 4000 &#xd7; km 1) / m 1000</p><p class="text-[1.1rem] leading-[1.42] max-lg:text-[0.98rem] max-sm:text-[0.95rem] max-sm:leading-[1.35]" data-id="pg058_n0010">= km 4</p><p class="mt-2 text-[1.1rem] leading-[1.42] max-lg:text-[0.98rem] max-sm:mt-2 max-sm:text-[0.95rem] max-sm:leading-[1.35]" data-id="pg058_n0011">Hivyo, m 4500 = km 4 + m 500.</p><p class="tex
