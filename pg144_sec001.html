  <script>
    (function() {
      var container = document.getElementById('zoezi-grid');
      var inputs = container.querySelectorAll('.zoezi-input');

      function normalize(v) {
        return v.trim().replace(',', '.');
      }

      function checkOne(input) {
        var feedback = input.parentElement.querySelector('.zoezi-feedback');
        var val = normalize(input.value);
        if (val === '') {
          feedback.textContent = '';
          input.classList.remove('border-green-500', 'border-red-500', 'text-green-700', 'text-red-700');
          input.classList.add('border-gray-500');
          return null;
        }
        var correct = parseFloat(input.getAttribute('data-answer'));
        var given = parseFloat(val);
        var isCorrect = !isNaN(given) && Math.abs(given - correct) < 0.001;

        input.classList.remove('border-gray-500', 'border-green-500', 'border-red-500', 'text-green-700', 'text-red-700');
        if (isCorrect) {
          input.classList.add('border-green-500', 'text-green-700');
          feedback.textContent = 'âœ“';
          feedback.className = 'zoezi-feedback text-lg text-green-600';
        } else {
          input.classList.add('border-red-500', 'text-red-700');
          feedback.textContent = 'âœ—';
          feedback.className = 'zoezi-feedback text-lg text-red-600';
        }
        return isCorrect;
      }

      inputs.forEach(function(input) {
        input.addEventListener('input', function() { checkOne(input); });
        input.addEventListener('blur', function() { checkOne(input); });
      });

      document.getElementById('tuma-btn').addEventListener('click', function() {
        var total = inputs.length;
        var correctCount = 0;
        inputs.forEach(function(input) {
          var result = checkOne(input);
          if (result) correctCount++;
        });
        document.getElementById('tuma-result').textContent =
          'Umepata ' + correctCount + ' kati ya ' + total + ' sahihi.';
      });
    })();
