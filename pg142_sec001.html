    <script>
      (function () {
        var section = document.querySelector('[data-section-id="pg142_sec001"]');
        if (!section) return;
        var form = section.querySelector('[data-activity-form="decimal-addition"]');
        var checkButton = form.querySelector('[data-action="check-answers"]');
        var scoreMessage = form.querySelector('[data-score-message]');
        var inputs = Array.prototype.slice.call(form.querySelectorAll('input[data-activity-item]'));

        function normalize(value) {
          return value.replace(/,/g, '.').trim();
        }

        function markInput(input, isCorrect, message) {
          var feedback = form.querySelector('[data-feedback-for="' + input.getAttribute('data-activity-item') + '"]');
          input.classList.remove('border-green-300', 'border-red-400', 'border-green-500', 'bg-red-50', 'bg-green-50');
          if (isCorrect) {
            input.classList.add('border-green-500', 'bg-green-50');
            feedback.textContent = 'Sahihi âœ“';
            feedback.className = 'text-sm font-bold text-green-700';
          } else {
            input.classList.add('border-red-400', 'bg-red-50');
            feedback.textContent = message;
            feedback.className = 'text-sm font-bold text-red-700';
          }
        }

        checkButton.addEventListener('click', function () {
          var correctCount = 0;
          inputs.forEach(function (input) {
            var expected = normalize(input.getAttribute('data-correct-answer'));
            var actual = normalize(input.value);

            if (!actual) {
              markInput(input, false, 'Hakuna jibu bado.');
              return;
            }

            var actualNum = Number(actual);
            var expectedNum = Number(expected);
            var isCorrect = !Number.isNaN(actualNum) && actualNum === expectedNum;

            if (isCorrect) {
              correctCount += 1;
              markInput(input, true, 'Sahihi âœ“');
            } else {
              markInput(input, false, 'Si sahihi âœ—');
            }
          });

          scoreMessage.textContent = 'Umejibu sahihi ' + correctCount + ' kati ya ' + inputs.length + '.';
        });

        form.addEventListener('reset', function () {
          window.setTimeout(function () {
            inputs.forEach(function (input) {
              input.classList.remove('border-red-400', 'border-green-500', 'bg-red-50', 'bg-green-50');
              input.classList.add('border-green-300');
              var feedback = form.querySelector('[data-feedback-for="' + input.getAttribute('data-activity-item') + '"]');
              feedback.textContent = 'Andika jibu kisha bonyeza Tuma majibu.';
              feedback.className = 'text-sm font-semibold text-gray-600';
            });
            scoreMessage.textContent = '';
          }, 0);
        });
      })();
